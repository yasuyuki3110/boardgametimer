<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>連動ボードゲームタイマー</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --danger-color: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    .screen { display: none; flex-direction: column; height: 100%; padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
    .screen.active { display: flex; }

    h1, h2 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.9rem; color: var(--text-sub); margin-bottom: 8px; }
    input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: var(--card-bg); color: #fff; font-size: 1.1rem; text-align: center; }

    .preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
    .btn-preset { padding: 12px; background: var(--card-bg); border: 2px solid transparent; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
    .btn-preset.selected { border-color: var(--accent-color); background: #2563eb; }

    .player-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .player-input-row { display: flex; gap: 10px; align-items: center; }
    .player-color-dot { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; }

    .btn-primary { width: 100%; padding: 16px; background: var(--accent-color); border: none; border-radius: 12px; color: #fff; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
    
    /* 動作画面 */
    .header-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; }
    .round-badge { background: #334155; padding: 6px 14px; border-radius: 20px; font-weight: bold; }
    .room-badge { font-size: 0.85rem; color: var(--text-sub); }

    .current-player-card { text-align: center; padding: 15px; border-radius: 16px; background: var(--card-bg); margin-bottom: 10px; transition: all 0.3s ease; }
    .player-name-disp { font-size: 2rem; font-weight: 800; margin-top: 5px; }

    .timer-display { text-align: center; margin: 10px 0; }
    .time-num { font-size: 5rem; font-weight: 900; font-family: monospace; letter-spacing: -2px; }
    .time-num.warning { color: var(--danger-color); animation: pulse 1s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* 巨大NextTurnボタン */
    .btn-next-turn { flex: 1; background: #22c55e; border: none; border-radius: 24px; color: #fff; font-size: 2.2rem; font-weight: 900; cursor: pointer; box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4); display: flex; align-items: center; justify-content: center; margin-top: 10px; transition: transform 0.1s; }
    .btn-next-turn:active { transform: scale(0.96); }

    .control-row { display: flex; gap: 10px; margin-top: 15px; }
    .btn-sub { flex: 1; padding: 12px; background: var(--card-bg); border: 1px solid #334155; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    // ★ ここにご自身のFirebaseプロジェクトの設定を貼り付けてください ★
    const firebaseConfig = {

      apiKey: "AIzaSyD-HipfsA_Yl9IYuMZYHunw6D-4UB9YPlA",
      authDomain: "boardgame-timer-b208e.firebaseapp.com",
      databaseURL: "https://boardgame-timer-b208e-default-rtdb.firebaseio.com",
      projectId: "boardgame-timer-b208e",
      storageBucket: "boardgame-timer-b208e.firebasestorage.app",
      messagingSenderId: "177281190929",
      appId: "1:177281190929:web:441e9bc23c5a2743fe75b0",
      measurementId: "G-VNHSXG9SRP"

    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // アプリ状態
    const PLAYER_COLORS = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
    let roomRef = null;
    let localTimerId = null;
    let currentRoomId = '';
    let localTimeLeft = 60;
    let audioCtx = null;
    let halfAlertFired = false;
    let sec60Fired = false;
    let sec30Fired = false;

    // UI要素
    const setupScreen = document.getElementById('setup-screen');
    const timerScreen = document.getElementById('timer-screen');
    const roomIdInput = document.getElementById('room-id-input');
    const playerCountSelect = document.getElementById('player-count');
    const playerInputsDiv = document.getElementById('player-inputs');
    const presetBtns = document.querySelectorAll('.btn-preset');
    
    let timeLimit = 60;
    let playerCount = 4;

    // 時間プリセット選択
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        presetBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        timeLimit = parseInt(btn.dataset.time);
      });
    });

    // プレイヤー数入力欄動的生成
    function renderPlayerInputs() {
      playerCount = parseInt(playerCountSelect.value);
      playerInputsDiv.innerHTML = '';
      for(let i = 0; i < playerCount; i++) {
        const row = document.createElement('div');
        row.className = 'player-input-row';
        row.innerHTML = `
          <div class="player-color-dot" style="background:${PLAYER_COLORS[i]}"></div>
          <input type="text" class="player-name-input" value="プレイヤー ${i+1}">
        `;
        playerInputsDiv.appendChild(row);
      }
    }
    playerCountSelect.addEventListener('change', renderPlayerInputs);
    renderPlayerInputs();

    // 部屋に参加 / 作成
    document.getElementById('btn-start').addEventListener('click', () => {
      const roomId = roomIdInput.value.trim();
      if(!roomId) return alert('部屋番号を入力してください');
      
      initAudio();
      currentRoomId = roomId;
      roomRef = ref(db, 'rooms/' + roomId);

      const names = Array.from(document.querySelectorAll('.player-name-input')).map((input, idx) => input.value || `P${idx+1}`);

      // 初期データをFirebaseにセット
      set(roomRef, {
        timeLimit: timeLimit,
        players: names,
        activePlayerIdx: 0,
        round: 1,
        turnStartTime: Date.now(),
        isRunning: true
      });

      setupScreen.classList.remove('active');
      timerScreen.classList.add('active');
      listenToFirebase();
    });

    // Web Audio サウンド再生
    function initAudio() {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playBeep(freq = 440, duration = 0.15) {
      if(!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Firebaseの変更を同期受信
    function listenToFirebase() {
      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if(!data) return;

        document.getElementById('disp-room-id').innerText = currentRoomId;
        document.getElementById('disp-round').innerText = `ラウンド ${data.round}`;
        
        const curName = data.players[data.activePlayerIdx] || `P${data.activePlayerIdx+1}`;
        const curColor = PLAYER_COLORS[data.activePlayerIdx % PLAYER_COLORS.length];
        
        const card = document.getElementById('player-card');
        card.style.borderLeft = `8px solid ${curColor}`;
        document.getElementById('disp-player-name').innerText = curName;
        document.getElementById('disp-player-name').style.color = curColor;

        // タイマーリアルタイムカウントダウン計算
        if(localTimerId) clearInterval(localTimerId);
        
        halfAlertFired = false;
        sec60Fired = false;
        sec30Fired = false;

        const updateClock = () => {
          if(!data.isRunning) return;
          const elapsed = Math.floor((Date.now() - data.turnStartTime) / 1000);
          localTimeLeft = Math.max(0, data.timeLimit - elapsed);
          
          const timeNum = document.getElementById('disp-time');
          const min = Math.floor(localTimeLeft / 60);
          const sec = localTimeLeft % 60;
          timeNum.innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;

          if(localTimeLeft <= 10 && localTimeLeft > 0) {
            timeNum.classList.add('warning');
            playBeep(600 + (10 - localTimeLeft) * 40, 0.1);
          } else {
            timeNum.classList.remove('warning');
          }

          // 音声警告判定
          if(localTimeLeft === Math.floor(data.timeLimit / 2) && !halfAlertFired) {
            playBeep(880, 0.3); halfAlertFired = true;
          }
          if(localTimeLeft === 60 && data.timeLimit > 60 && !sec60Fired) {
            playBeep(660, 0.3); sec60Fired = true;
          }
          if(localTimeLeft === 30 && data.timeLimit > 30 && !sec30Fired) {
            playBeep(750, 0.3); sec30Fired = true;
          }
        };

        updateClock();
        localTimerId = setInterval(updateClock, 1000);
      });
    }

    // 次のターンへ（巨大ボタン）
    document.getElementById('btn-next').addEventListener('click', () => {
      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if(!data) return;
        
        let nextIdx = (data.activePlayerIdx + 1) % data.players.length;
        let nextRound = data.round;
        if(nextIdx === 0) nextRound++; // 1周したらラウンドアップ

        set(roomRef, {
          ...data,
          activePlayerIdx: nextIdx,
          round: nextRound,
          turnStartTime: Date.now(),
          isRunning: true
        });
      }, { onlyOnce: true });
    });

    // リセット
    document.getElementById('btn-reset').addEventListener('click', () => {
      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if(!data) return;
        set(roomRef, {
          ...data,
          turnStartTime: Date.now(),
          isRunning: true
        });
      }, { onlyOnce: true });
    });

    // 設定へ戻る
    document.getElementById('btn-back').addEventListener('click', () => {
      if(localTimerId) clearInterval(localTimerId);
      timerScreen.classList.remove('active');
      setupScreen.classList.add('active');
    });
  </script>
</head>
<body>

  <!-- 1. 設定画面 -->
  <div id="setup-screen" class="screen active">
    <h1>ボドゲタイマー (連動版)</h1>
    
    <div class="form-group">
      <label>部屋番号 (同じ番号で連動)</label>
      <input type="text" id="room-id-input" value="1234" placeholder="例: 1234">
    </div>

    <div class="form-group">
      <label>持ち時間</label>
      <div class="preset-grid">
        <button class="btn-preset" data-time="30">30s</button>
        <button class="btn-preset selected" data-time="60">60s</button>
        <button class="btn-preset" data-time="90">90s</button>
        <button class="btn-preset" data-time="120">120s</button>
        <button class="btn-preset" data-time="150">150s</button>
        <button class="btn-preset" data-time="300">300s</button>
      </div>
    </div>

    <div class="form-group">
      <label>プレイヤー人数</label>
      <select id="player-count" style="width:100%; padding:10px; background:var(--card-bg); color:#fff; border-radius:8px; border:1px solid #334155; font-size:1rem;">
        <option value="2">2名</option>
        <option value="3">3名</option>
        <option value="4" selected>4名</option>
        <option value="5">5名</option>
        <option value="6">6名</option>
      </select>
    </div>

    <div class="form-group">
      <label>プレイヤー名</label>
      <div id="player-inputs" class="player-list"></div>
    </div>

    <button id="btn-start" class="btn-primary">ゲーム開始 / 接続</button>
  </div>

  <!-- 2. 動作画面 (タイマー & 巨大Nextボタン) -->
  <div id="timer-screen" class="screen">
    <div class="header-bar">
      <div class="round-badge" id="disp-round">ラウンド 1</div>
      <div class="room-badge">部屋: <span id="disp-room-id">1234</span></div>
    </div>

    <div class="current-player-card" id="player-card">
      <div style="font-size: 0.85rem; color: var(--text-sub);">CURRENT TURN</div>
      <div class="player-name-disp" id="disp-player-name">プレイヤー 1</div>
    </div>

    <div class="timer-display">
      <div class="time-num" id="disp-time">1:00</div>
    </div>

    <button id="btn-next" class="btn-next-turn">NEXT TURN</button>

    <div class="control-row">
      <button id="btn-reset" class="btn-sub">タイマーリセット</button>
      <button id="btn-back" class="btn-sub">設定変更</button>
    </div>
  </div>

</body>
</html>
