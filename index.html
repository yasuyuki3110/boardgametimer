<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>連動ボードゲームタイマー</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      --next-btn-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --danger-color: #f43f5e;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 70%);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .screen { display: none; flex-direction: column; height: 100%; padding: 24px 20px; max-width: 500px; margin: 0 auto; width: 100%; overflow-y: auto; }
    .screen.active { display: flex; }

    h1 { text-align: center; font-size: 1.6rem; font-weight: 800; margin-bottom: 24px; letter-spacing: -0.5px; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .form-group { margin-bottom: 22px; }
    label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    
    input[type="text"], select {
      width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--card-bg); color: #fff; font-size: 1rem; backdrop-filter: blur(10px); outline: none; transition: all 0.2s;
    }
    input[type="text"]:focus, select:focus { border-color: #60a5fa; box-shadow: 0 0 12px rgba(96, 165, 250, 0.2); }

    .preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .btn-preset { padding: 12px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; color: var(--text-main); font-weight: 700; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.2s; }
    .btn-preset.selected { background: var(--accent-gradient); border-color: transparent; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }

    .start-player-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .btn-start-p { padding: 10px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; color: var(--text-sub); font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.2s; }
    .btn-start-p.selected { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; color: #fff; font-weight: 700; }

    .player-list { display: flex; flex-direction: column; gap: 8px; }
    .player-input-row { display: flex; gap: 10px; align-items: center; background: var(--card-bg); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--card-border); backdrop-filter: blur(10px); }
    .player-color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }
    .player-input-row input { border: none; background: transparent; padding: 0; font-size: 0.95rem; text-align: left; }

    .btn-primary { width: 100%; padding: 16px; background: var(--accent-gradient); border: none; border-radius: 14px; color: #fff; font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: auto; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3); transition: transform 0.1s; }
    .btn-primary:active { transform: scale(0.98); }

    /* 動作画面 */
    .header-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; }
    .round-badge { background: rgba(255, 255, 255, 0.06); padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; border: 1px solid var(--card-border); }
    .room-badge { font-size: 0.85rem; color: var(--text-sub); font-weight: 600; }

    .current-player-card {
      text-align: center; padding: 20px; border-radius: 20px; background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(15px); margin: 10px 0; transition: all 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .player-name-disp { font-size: 2.2rem; font-weight: 900; margin-top: 4px; letter-spacing: -0.5px; }

    .timer-display { text-align: center; margin: 15px 0; }
    .time-num { font-size: 5.5rem; font-weight: 900; font-family: 'SF Pro Display', -apple-system, monospace; letter-spacing: -3px; text-shadow: 0 0 20px rgba(255, 255, 255, 0.1); }
    .time-num.warning { color: var(--danger-color); text-shadow: 0 0 25px rgba(244, 63, 94, 0.5); animation: pulse 1s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* 巨大NextTurnボタン */
    .btn-next-turn {
      flex: 1; min-height: 180px; background: var(--next-btn-gradient); border: none; border-radius: 28px; color: #fff; font-size: 2.4rem; font-weight: 900; cursor: pointer; box-shadow: 0 12px 30px rgba(16, 185, 129, 0.35); display: flex; align-items: center; justify-content: center; margin-top: 10px; transition: all 0.15s ease; border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-next-turn:active { transform: scale(0.96); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.2); }

    .control-row { display: flex; gap: 12px; margin-top: 16px; }
    .btn-sub { flex: 1; padding: 14px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; color: var(--text-sub); font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
    .btn-sub:active { background: rgba(255, 255, 255, 0.1); color: #fff; }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    // ★ ここにご自身のFirebaseプロジェクトの設定を貼り付けてください ★
    const firebaseConfig = {

      apiKey: "AIzaSyD-HipfsA_Yl9IYuMZYHunw6D-4UB9YPlA",
      authDomain: "boardgame-timer-b208e.firebaseapp.com",
      databaseURL: "https://boardgame-timer-b208e-default-rtdb.firebaseio.com",
      projectId: "boardgame-timer-b208e",
      storageBucket: "boardgame-timer-b208e.firebasestorage.app",
      messagingSenderId: "177281190929",
      appId: "1:177281190929:web:441e9bc23c5a2743fe75b0",
      measurementId: "G-VNHSXG9SRP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const PLAYER_COLORS = ['#60a5fa', '#f43f5e', '#34d399', '#fbbf24', '#a78bfa', '#f472b6'];
    let roomRef = null;
    let localTimerId = null;
    let currentRoomId = '';
    let localTimeLeft = 60;
    let audioCtx = null;
    let halfAlertFired = false;
    let sec60Fired = false;
    let sec30Fired = false;

    let timeLimit = 60;
    let startPlayerIdx = 0; // スタート位置（0番目 = プレイヤー1）

    const setupScreen = document.getElementById('setup-screen');
    const timerScreen = document.getElementById('timer-screen');
    const roomIdInput = document.getElementById('room-id-input');
    const playerCountSelect = document.getElementById('player-count');
    const playerInputsDiv = document.getElementById('player-inputs');
    const startPlayerGrid = document.getElementById('start-player-grid');
    const presetBtns = document.querySelectorAll('.btn-preset');

    // 時間プリセット選択
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        presetBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        timeLimit = parseInt(btn.dataset.time);
      });
    });

    // プレイヤー入力欄 & スタートプレイヤー選択ボタンの描画
    function renderPlayersUI() {
      const count = parseInt(playerCountSelect.value);
      
      // 1. プレイヤー名入力欄
      playerInputsDiv.innerHTML = '';
      for(let i = 0; i < count; i++) {
        const row = document.createElement('div');
        row.className = 'player-input-row';
        row.innerHTML = `
          <div class="player-color-dot" style="background:${PLAYER_COLORS[i % PLAYER_COLORS.length]}; color:${PLAYER_COLORS[i % PLAYER_COLORS.length]}"></div>
          <input type="text" class="player-name-input" value="プレイヤー ${i+1}" data-idx="${i}">
        `;
        playerInputsDiv.appendChild(row);
      }

      // 2. スタートプレイヤー（親）選択ボタン
      startPlayerGrid.innerHTML = '';
      if(startPlayerIdx >= count) startPlayerIdx = 0;

      for(let i = 0; i < count; i++) {
        const btn = document.createElement('button');
        btn.className = `btn-start-p ${i === startPlayerIdx ? 'selected' : ''}`;
        btn.innerText = `プレイヤー ${i+1}`;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.btn-start-p').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          startPlayerIdx = i;
        });
        startPlayerGrid.appendChild(btn);
      }
    }

    playerCountSelect.addEventListener('change', renderPlayersUI);
    renderPlayersUI();

    // 部屋に参加 / 作成
    document.getElementById('btn-start').addEventListener('click', () => {
      const roomId = roomIdInput.value.trim();
      if(!roomId) return alert('部屋番号を入力してください');
      
      initAudio();
      currentRoomId = roomId;
      roomRef = ref(db, 'rooms/' + roomId);

      const names = Array.from(document.querySelectorAll('.player-name-input')).map((input, idx) => input.value || `P${idx+1}`);

      set(roomRef, {
        timeLimit: timeLimit,
        players: names,
        activePlayerIdx: startPlayerIdx,
        startPlayerIdx: startPlayerIdx,
        round: 1,
        turnStartTime: Date.now(),
        isRunning: true
      });

      setupScreen.classList.remove('active');
      timerScreen.classList.add('active');
      listenToFirebase();
    });

    function initAudio() {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playBeep(freq = 440, duration = 0.15) {
      if(!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function listenToFirebase() {
      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if(!data) return;

        document.getElementById('disp-room-id').innerText = currentRoomId;
        document.getElementById('disp-round').innerText = `ラウンド ${data.round}`;
        
        const curName = data.players[data.activePlayerIdx] || `P${data.activePlayerIdx+1}`;
        const curColor = PLAYER_COLORS[data.activePlayerIdx % PLAYER_COLORS.length];
        
        const card = document.getElementById('player-card');
        card.style.borderLeft = `6px solid ${curColor}`;
        card.style.boxShadow = `0 10px 30px ${curColor}22`;
        document.getElementById('disp-player-name').innerText = curName;
        document.getElementById('disp-player-name').style.color = curColor;

        if(localTimerId) clearInterval(localTimerId);
        
        halfAlertFired = false;
        sec60Fired = false;
        sec30Fired = false;

        const updateClock = () => {
          if(!data.isRunning) return;
          const elapsed = Math.floor((Date.now() - data.turnStartTime) / 1000);
          localTimeLeft = Math.max(0, data.timeLimit - elapsed);
          
          const timeNum = document.getElementById('disp-time');
          const min = Math.floor(localTimeLeft / 60);
          const sec = localTimeLeft % 60;
          timeNum.innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;

          if(localTimeLeft <= 10 && localTimeLeft > 0) {
            timeNum.classList.add('warning');
            playBeep(600 + (10 - localTimeLeft) * 40, 0.1);
          } else {
            timeNum.classList.remove('warning');
          }

          if(localTimeLeft === Math.floor(data.timeLimit / 2) && !halfAlertFired) {
            playBeep(880, 0.25); halfAlertFired = true;
          }
          if(localTimeLeft === 60 && data.timeLimit > 60 && !sec60Fired) {
            playBeep(660, 0.25); sec60Fired = true;
          }
          if(localTimeLeft === 30 && data.timeLimit > 30 && !sec30Fired) {
            playBeep(750, 0.25); sec30Fired = true;
          }
        };

        updateClock();
        localTimerId = setInterval(updateClock, 1000);
      });
    }

    document.getElementById('btn-next').addEventListener('click', () => {
      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if(!data) return;
        
        let nextIdx = (data.activePlayerIdx + 1) % data.players.length;
        let nextRound = data.round;
        
        // 最初の親（スタートプレイヤー）に番が戻ってきたらラウンド＋1
        if(nextIdx === (data.startPlayerIdx || 0)) {
          nextRound++;
        }

        set(roomRef, {
          ...data,
          activePlayerIdx: nextIdx,
          round: nextRound,
          turnStartTime: Date.now(),
          isRunning: true
        });
      }, { onlyOnce: true });
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if(!data) return;
        set(roomRef, {
          ...data,
          turnStartTime: Date.now(),
          isRunning: true
        });
      }, { onlyOnce: true });
    });

    document.getElementById('btn-back').addEventListener('click', () => {
      if(localTimerId) clearInterval(localTimerId);
      timerScreen.classList.remove('active');
      setupScreen.classList.add('active');
    });
  </script>
</head>
<body>

  <!-- 1. 設定画面 -->
  <div id="setup-screen" class="screen active">
    <h1>ボドゲタイマー</h1>
    
    <div class="form-group">
      <label>部屋番号 (連動用)</label>
      <input type="text" id="room-id-input" value="1234" placeholder="例: 1234">
    </div>

    <div class="form-group">
      <label>持ち時間</label>
      <div class="preset-grid">
        <button class="btn-preset" data-time="30">30s</button>
        <button class="btn-preset selected" data-time="60">60s</button>
        <button class="btn-preset" data-time="90">90s</button>
        <button class="btn-preset" data-time="120">120s</button>
        <button class="btn-preset" data-time="150">150s</button>
        <button class="btn-preset" data-time="300">300s</button>
      </div>
    </div>

    <div class="form-group">
      <label>プレイヤー人数</label>
      <select id="player-count">
        <option value="2">2名</option>
        <option value="3">3名</option>
        <option value="4" selected>4名</option>
        <option value="5">5名</option>
        <option value="6">6名</option>
      </select>
    </div>

    <div class="form-group">
      <label>最初にスタートする人（親）</label>
      <div id="start-player-grid" class="start-player-grid"></div>
    </div>

    <div class="form-group">
      <label>プレイヤー名</label>
      <div id="player-inputs" class="player-list"></div>
    </div>

    <button id="btn-start" class="btn-primary">ゲーム開始</button>
  </div>

  <!-- 2. 動作画面 -->
  <div id="timer-screen" class="screen">
    <div class="header-bar">
      <div class="round-badge" id="disp-round">ラウンド 1</div>
      <div class="room-badge">ROOM: <span id="disp-room-id">1234</span></div>
    </div>

    <div class="current-player-card" id="player-card">
      <div style="font-size: 0.75rem; color: var(--text-sub); font-weight: 700; letter-spacing: 1px;">CURRENT TURN</div>
      <div class="player-name-disp" id="disp-player-name">プレイヤー 1</div>
    </div>

    <div class="timer-display">
      <div class="time-num" id="disp-time">1:00</div>
    </div>

    <button id="btn-next" class="btn-next-turn">NEXT TURN</button>

    <div class="control-row">
      <button id="btn-reset" class="btn-sub">タイマーリセット</button>
      <button id="btn-back" class="btn-sub">設定変更</button>
    </div>
  </div>

</body>
</html>
